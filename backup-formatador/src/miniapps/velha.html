<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#10131c;color:#f5f7ff;font-family:Arial,sans-serif}.app{max-width:470px;margin:auto;background:#1a2030;border:1px solid #36415b;border-radius:22px;padding:18px}h1{text-align:center;font-size:26px;margin:3px 0 8px}.sub{text-align:center;color:#b8c4dc;font-size:13px}.status{text-align:center;background:#252f45;border-radius:12px;padding:12px;margin:14px 0;font-weight:bold}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.cell{aspect-ratio:1;border:1px solid #465574;border-radius:16px;background:linear-gradient(145deg,#303b54,#20283a);color:white;font-size:clamp(44px,14vw,76px);font-weight:bold;display:flex;align-items:center;justify-content:center}.cell.x{color:#68d8ff}.cell.o{color:#ff8ab6}.cell.win{background:#235344;border-color:#64e8bb}.controls{display:flex;gap:8px;margin-top:14px}.controls button{flex:1;border:0;border-radius:11px;padding:12px;background:#384766;color:white;font-weight:bold}.mode{display:flex;gap:8px;margin:14px 0}.mode button{flex:1;border:1px solid #53617b;border-radius:11px;padding:11px 7px;background:#202a3d;color:#dce5f6;font-weight:bold}.mode button.active{background:#5144a4;border-color:#8f83ff;color:white}.note{text-align:center;font-size:12px;color:#b8c4dc;margin-top:12px}
</style></head><body><div class="app"><h1>⭕ JOGO DA VELHA ❌</h1><div class="sub">Escolha o modo e tente fazer uma linha de três!</div><div class="mode"><button id="bot" class="active">🤖 Contra a máquina</button><button id="two">👥 2 jogadores</button></div><div id="status" class="status">Sua vez — X</div><div id="board" class="board"></div><div class="controls"><button id="reset">↻ Nova partida</button><button id="swap">⇄ Trocar símbolo</button></div><div class="note">O primeiro a alinhar 3 símbolos na horizontal, vertical ou diagonal vence.</div></div><script>
const $=id=>document.getElementById(id);let b,turn='X',mode='bot',human='X',over=false,winning=[];const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function winner(a){for(let l of lines)if(a[l[0]]&&a[l[0]]===a[l[1]]&&a[l[1]]===a[l[2]])return{p:a[l[0]],line:l};return null}function fresh(){b=Array(9).fill('');turn='X';over=false;winning=[];render();if(mode==='bot'&&human==='O')botMove()}function render(msg){let el=$('board');el.innerHTML='';for(let i=0;i<9;i++){let s=document.createElement('button');s.className='cell '+(b[i]==='X'?'x':b[i]==='O'?'o':'')+(winning.includes(i)?' win':'');s.textContent=b[i];s.disabled=over||!!b[i]||(mode==='bot'&&turn!==human);s.onclick=()=>play(i);el.appendChild(s)}$('status').textContent=msg||(over?'Partida encerrada':mode==='bot'?(turn===human?'Sua vez — '+human:'A máquina está pensando…'):'Vez de '+turn)}function finish(){let w=winner(b);if(w){over=true;winning=w.line;render(w.p===(mode==='bot'?human:(turn==='X'?'O':'X'))?'🎉 Você venceu!':'🏆 '+w.p+' venceu!');return true}if(b.every(Boolean)){over=true;render('🤝 Deu velha! Empate.');return true}return false}function play(i){if(over||b[i]||(mode==='bot'&&turn!==human))return;b[i]=turn;if(finish())return;turn=turn==='X'?'O':'X';render();if(mode==='bot'&&turn!==human)setTimeout(botMove,350)}function botMove(){if(over)return;const ai=human==='X'?'O':'X';let best=-Infinity,choice=-1;for(let i=0;i<9;i++)if(!b[i]){b[i]=ai;let score=minimax(b,0,false,ai);b[i]='';if(score>best){best=score;choice=i}}if(choice<0)return;b[choice]=ai;if(finish())return;turn=turn==='X'?'O':'X';render()}function minimax(a,depth,maximizing,ai){const hu=ai==='X'?'O':'X';let w=winner(a);if(w)return w.p===ai?10-depth:-10+depth;if(a.every(Boolean))return 0;if(maximizing){let v=-Infinity;for(let i=0;i<9;i++)if(!a[i]){a[i]=ai;v=Math.max(v,minimax(a,depth+1,false,ai));a[i]=''}return v}else{let v=Infinity;for(let i=0;i<9;i++)if(!a[i]){a[i]=hu;v=Math.min(v,minimax(a,depth+1,true,ai));a[i]=''}return v}}function setMode(m){mode=m;$('bot').classList.toggle('active',m==='bot');$('two').classList.toggle('active',m==='two');fresh()}$('bot').onclick=()=>setMode('bot');$('two').onclick=()=>setMode('two');$('reset').onclick=fresh;$('swap').onclick=()=>{human=human==='X'?'O':'X';fresh()};fresh();</script></body></html>
