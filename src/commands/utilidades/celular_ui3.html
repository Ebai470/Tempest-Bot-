  if(cur)h+='<div style="position:relative;padding-top:56.25%;background:#000;border-radius:12px;overflow:hidden;margin-bottom:6px"><iframe src="https://www.youtube.com/embed/'+cur+'?autoplay=1&playsinline=1&rel=0" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe></div><div class="mut" style="margin-bottom:8px">Se não carregar, o vídeo ou o WhatsApp bloqueia a reprodução aqui.</div>';
  h+='<div class="row"><input id="yi" placeholder="Link ou ID do vídeo" style="margin:0;flex:1"><div class="btn" id="yg" style="padding:10px">▶</div></div>';
  if(RES.length)h+='<div class="mut" style="margin:10px 0 4px">Resultados da busca</div>'+RES.map(function(r,k){return '<div class="card" data-r="'+k+'"><b>'+esc(r.t)+'</b><div class="mut">'+esc(r.c)+(r.d?' • '+esc(r.d):'')+'</div></div>'}).join('');
  h+='<div class="mut" style="margin:10px 0 4px">'+(H.length?'Recentes':'Para buscar vídeos, mande no chat: !celular4 yt &lt;busca&gt;')+'</div>'+H.map(function(x,k){return '<div class="card" data-h="'+k+'">▶ '+esc(x.t)+'</div>'}).join('');
  b.innerHTML=h;
  $('yg').onclick=function(){var v=pid($('yi').value);if(v)play(v);else toast('Link inválido')};
  b.querySelectorAll('[data-r]').forEach(function(e){e.onclick=function(){var r=RES[+e.getAttribute('data-r')];if(r)play(r.i,r.t)}});
  b.querySelectorAll('[data-h]').forEach(function(e){e.onclick=function(){var x=H[+e.getAttribute('data-h')];if(x)play(x.i,x.t)}})}
 d()};

 var ENG=[['wiki','Wikipédia'],['bing','Bing'],['ddg','DuckDuckGo'],['google','Google'],['brave','Brave']],eng=ld('mpne','wiki'),U=ld('mpnv',[]),WK='https://pt.wikipedia.org/w/api.php';
 function norm(s){s=String(s||'').trim();if(!s)return null;if(!/^[a-z][a-z0-9+.-]*:/i.test(s))s='https://'+s;try{var u=new URL(s);return (u.protocol==='https:'||u.protocol==='http:')?u.href:null}catch(e){return null}}
 function isUrl(s){return !/\s/.test(s)&&(/^https?:\/\//i.test(s)||/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(s))}
 function txt(h){return new DOMParser().parseFromString(String(h||''),'text/html').body.textContent}
 function frame(u){return '<iframe src="'+esc(u)+'" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" referrerpolicy="no-referrer" style="width:100%;height:100%;border:0"></iframe>'}

 function open1(u){u=norm(u);if(!u){toast('Endereço inválido');return}U=U.filter(function(x){return x!==u});U.unshift(u);U=U.slice(0,8);sd('mpnv',U);hist();view(frame(u),1)}
 function eurl(e,q){q=encodeURIComponent(q);return {bing:'https://www.bing.com/search?q='+q+'&adlt=strict',ddg:'https://duckduckgo.com/?q='+q+'&kp=1',google:'https://www.google.com/search?igu=1&safe=active&q='+q,brave:'https://search.brave.com/search?q='+q+'&safesearch=strict'}[e]}
 function jget(u){return fetch(u).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}
 function net(){view('<div class="card">📡 Sem acesso à internet dentro da mensagem para a Wikipédia. Tente outro motor (Bing, DuckDuckGo…), que abre numa moldura.</div>')}
 function wiki(q){view('<div class="mut" style="margin-top:8px">Pesquisando…</div>');

   b.querySelectorAll('[data-w]').forEach(function(e){e.onclick=function(){art(L[+e.getAttribute('data-w')].title)}})}).catch(net)}

   view('<div class="card"><b style="font-size:16px">'+esc(t)+'</b><div style="white-space:pre-wrap;margin-top:8px;font-size:13px;line-height:1.45">'+esc(body)+'</div></div><div class="btn" id="nm">Abrir página completa</div><div class="btn" id="nb" style="background:#555;margin-top:8px">‹ Voltar aos resultados</div>');
   $('nm').onclick=function(){open1('https://pt.m.wikipedia.org/wiki/'+encodeURIComponent(t.replace(/ /g,'_')))};$('nb').onclick=function(){wiki($('nq').value||t)}}).catch(net)}
 function search(){var q=$('nq').value.trim();if(!q)return;if(isUrl(q)){open1(q);return}if(eng==='wiki')wiki(q);else open1(eurl(eng,q))}
